    <text x="28" y="400">Enter the second integer: 18</text>
    <text x="500" y="114">48 = 18 * 2 + 12</text>
    <text x="500" y="144">18 = 12 * 1 + 6</text>
    <text x="500" y="174">12 = 6 * 2 + 0</text>
    <text x="500" y="214" fill="#86efac">GCD: 6</text>
    <text x="500" y="274">Arithmetic sequence</text>
    <text x="500" y="310" fill="#fcd34d">2, 5, 8, 11, 14</text>
